name: multi-backtest
on:
  workflow_dispatch:
    inputs:
      cost:
        description: "Cost % per side"
        default: "0.05"
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          COST: ${{ inputs.cost }}
        run: python multi_backtest.py --cost "$COST" | tee result.txt
      - name: Summary
        if: always()
        run: |
          { echo '```'; cat result.txt 2>/dev/null || echo "No output, see logs"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
