name: check-data
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check
        run: python check_data.py 2>&1 | tee result.txt
      - name: Summary
        if: always()
        run: |
          { echo '```'; cat result.txt 2>/dev/null || echo "No output"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
