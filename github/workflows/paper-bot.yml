name: paper-bot

on:
  schedule:
    - cron: "*/15 4-9 * * 1-5"
    - cron: "45 3 * * 1-5"
    - cron: "0,15 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python paper_bot.py --once
      - name: Save state back to the repo
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add -A state.json trades.csv decisions.log 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "bot tick" && git push)
